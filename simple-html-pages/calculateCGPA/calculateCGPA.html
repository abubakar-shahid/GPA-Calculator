<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculate CGPA</title>
        <link rel="stylesheet" href="./calculateCGPA.css">
        <script src="./calculateCGPA.js"></script>
    </head>
    <body>
        <div>
            <header class="header">
                <p class="heading">CGPA Calculator</p>
            </header>
            <div class="center">
                <input
                    type="button"
                    class="button-new-semester"
                    value="Add another Semester"
                    onclick="newSemester();"
                >
            </div>
            <form action="./calculateCGPA.html" id="myForm">
                <div id="mainDiv">
                    <div class="input-group">
                        <label for="">CGPA of Semester</label>
                        <label for="">Credit Hours</label>
                    </div>
                    <div class="input-group" id="myDiv1">
                        <input
                            type="text"
                            name="semester1"
                            id="semester1"
                            placeholder="Semester 1"
                            required
                        >
                        <input
                            name="cr1"
                            id="cr1"
                            type="number"
                            min="1"
                            max="18"
                            step="1"
                            value=""
                            required
                        >
                    </div>
                    <div class="input-group" id="myDiv2">
                        <input
                            type="text"
                            name="semester2"
                            id="semester2"
                            placeholder="Semester 2"
                            required
                        >
                        <input
                            name="cr2"
                            id="cr2"
                            type="number"
                            min="1"
                            max="18"
                            step="1"
                            value=""
                            required
                        >
                    </div>
                </div>
                <div class="center">
                    <input
                        type="button"
                        class="button"
                        value="Calculate CGPA"
                        onclick="calculateCGPA();"
                    >
                </div>
                <div class="output-group">
                    <label for="output">CGPA :</label>
                    <input
                        type="text"
                        name="output"
                        id="output"
                        readonly
                    >
                    <input type="reset" value="Clear All">
                </div>
            </form>
            <div class="center">
                <button class="button" onclick="location.href='./index.html'">Exit to Home</button>
            </div>
        </div>
    </body>
</html>
