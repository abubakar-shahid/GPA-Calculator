<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculate SGPA</title>
        <link rel="stylesheet" href="./calculateSGPA.css">
        <script src="./calculateSGPA.js"></script>
    </head>
    <body>
        <h1>SGPA Calculator</h1>
        <div class="flex">
            <input
                type="button"
                class="button"
                value="Add another Course"
                onclick="newCourse();"
            >
        </div>
        <form>
            <div class="form-group" id="myDiv">
                <label for="course1">Courses (Optional)</label>
                <label for="cr1">Credit Hrs</label>
                <label for="gr1">Grade</label>
                <input
                    type="text"
                    name="course1"
                    id="course1"
                    class="input-field"
                    placeholder="Course No. 1"
                >
                <select name="cr1" id="cr1" class="input-field">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
                <select name="gr1" id="gr1" class="input-field">
                    <option value="A+">A+</option>
                    <option value="A">A</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B">B</option>
                    <option value="B-">B-</option>
                    <option value="C+">C+</option>
                    <option value="C">C</option>
                    <option value="C-">C-</option>
                    <option value="D+">D+</option>
                    <option value="D">D</option>
                    <option value="F">F</option>
                </select>
                <!-- More inputs and selects for additional courses -->
            </div>
            <div class="flex">
                <input
                    type="button"
                    class="button"
                    value="Calculate SGPA"
                    onclick="calculateSGPA();"
                >
            </div>
            <div class="flex font-semibold">
                <label for="output">SGPA:</label>
                <input
                    type="text"
                    name="output"
                    id="output"
                    class="input-field"
                    readonly
                >
                <input type="reset" value="Clear All" class="button">
            </div>
        </form>
        <div class="flex">
            <button class="button">
                <a href="./index.html" style="color: inherit; text-decoration: none;">Exit to Home</a>
            </button>
        </div>
    </body>
</html>
